name: Deploy Course Book

on:
  push:
    branches: [main]
    paths:
      - 'marco_teorico/**'
      - 'notebooks/**'
      - 'coursebook/**'
      - 'build_book.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install jupyter-book==1.0.3
          pip install numpy pandas matplotlib networkx scipy

      - name: Assemble book
        run: python build_book.py

      - name: Build book
        run: jupyter-book build coursebook/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: coursebook/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
