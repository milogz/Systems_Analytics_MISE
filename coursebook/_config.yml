title: "Analisis de Sistemas para la Industria Energetica"
author: "Maestria en Ingenieria de Sistemas Energeticos (MISE)"
logo: ""
copyright: "2025"

execute:
  execute_notebooks: "off"

parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - dollarmath
    - html_admonition
    - html_image
    - linkify
    - replacements
    - smartquotes
    - substitution

html:
  favicon: ""
  use_issues_button: false
  use_repository_button: true
  use_edit_page_button: false
  home_page_in_navbar: true
  extra_footer: |
    <p>Material del curso Analisis de Sistemas — MISE, Universidad de los Andes</p>

repository:
  url: https://github.com/YOUR_USER/Systems_Analytics_MISE
  branch: main

sphinx:
  config:
    language: es
    html_show_copyright: true
