title: "Análisis de Sistemas para la Industria Energética"
author: "MISE — Maestría en Innovación de Sistemas Energéticos, Universidad de los Andes"
logo: logo.jpg

execute:
  execute_notebooks: "off"

exclude_patterns:
  - "cierre/*"
  - "mise_utils/*"
  - "_build/*"

parse:
  myst_enable_extensions:
    - amsmath
    - dollarmath
    - colon_fence
    - html_admonition

sphinx:
  config:
    html_theme_options:
      repository_url: "https://github.com/milogz/Systems_Analytics_MISE"
      use_repository_button: true
      show_toc_level: 2
    html_css_files:
      - custom.css
